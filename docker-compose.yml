services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ultrasound_raw_data --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic wrist_predictions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic hand_state_predictions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic model_predictions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ultrasound_raw_data_replay --partitions 1 --replication-factor 1
    restart: "no"

  wrist-inference-live:
    build: .
    command: python3 src/wrist_inference.py --mode kafka
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data
      TOPIC_OUT: wrist_predictions
      MODEL_DIR: /app/ml_infra/wrist_regressor/models/boosted_tree_regression_sessionnorm
      CALIBRATION_MODE: ${CALIBRATION_MODE:-warmup_freeze}
      WARMUP_FRAMES: ${WARMUP_FRAMES:-50}
      FREEZE_AFTER: ${FREEZE_AFTER:-50}
      LOG_EVERY: ${LOG_EVERY:-200}
      PREDICTION_LOG_EVERY: ${PREDICTION_LOG_EVERY:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-wrist_inference_group_live}
    restart: on-failure
    profiles:
      - live

  wrist-inference-replay-raw:
    build: .
    command: python3 src/wrist_inference.py --mode kafka
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data_replay
      TOPIC_OUT: wrist_predictions
      MODEL_DIR: /app/ml_infra/wrist_regressor/models/boosted_tree_regression_sessionnorm
      CALIBRATION_MODE: ${CALIBRATION_MODE:-warmup_freeze}
      WARMUP_FRAMES: ${WARMUP_FRAMES:-50}
      FREEZE_AFTER: ${FREEZE_AFTER:-50}
      LOG_EVERY: ${LOG_EVERY:-200}
      PREDICTION_LOG_EVERY: ${PREDICTION_LOG_EVERY:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-wrist_inference_group_replay_raw}
    restart: on-failure
    profiles:
      - replay-raw

  binary-inference-live:
    build: .
    command: python3 src/inference.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data
      TOPIC_OUT: hand_state_predictions
      MODEL_JSON_PATH: /app/ml_infra/binary_classifier/tree_serialization/xgb_binary_open_close_hand_model.json
      MODEL_LIB_PATH: /app/ml_infra/binary_classifier/inference/xgb_binary_open_close_hand_model.so
      INPUT_DIM: ${BINARY_INPUT_DIM:-200}
      NORMALIZE_FRAME: ${BINARY_NORMALIZE_FRAME:-false}
      THRESHOLD: ${HAND_STATE_THRESHOLD:-0.5}
      LOG_EVERY: ${BINARY_LOG_EVERY:-200}
      PREDICTION_LOG_EVERY: ${BINARY_PREDICTION_LOG_EVERY:-0}
      CONSUMER_GROUP_ID: ${BINARY_CONSUMER_GROUP_ID:-binary_inference_group_live}
    restart: on-failure
    profiles:
      - live

  binary-inference-replay-raw:
    build: .
    command: python3 src/inference.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data_replay
      TOPIC_OUT: hand_state_predictions
      MODEL_JSON_PATH: /app/ml_infra/binary_classifier/tree_serialization/xgb_binary_open_close_hand_model.json
      MODEL_LIB_PATH: /app/ml_infra/binary_classifier/inference/xgb_binary_open_close_hand_model.so
      INPUT_DIM: ${BINARY_INPUT_DIM:-200}
      NORMALIZE_FRAME: ${BINARY_NORMALIZE_FRAME:-false}
      THRESHOLD: ${HAND_STATE_THRESHOLD:-0.5}
      LOG_EVERY: ${BINARY_LOG_EVERY:-200}
      PREDICTION_LOG_EVERY: ${BINARY_PREDICTION_LOG_EVERY:-0}
      CONSUMER_GROUP_ID: ${BINARY_CONSUMER_GROUP_ID:-binary_inference_group_replay_raw}
    restart: on-failure
    profiles:
      - replay-raw

  prediction-fusion:
    build: .
    command: python3 src/prediction_fusion.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      WRIST_TOPIC_IN: wrist_predictions
      HAND_TOPIC_IN: hand_state_predictions
      TOPIC_OUT: model_predictions
      CONSUMER_GROUP_ID: ${FUSION_CONSUMER_GROUP_ID:-prediction_fusion_group}
      MAX_SYNC_LAG_MS: ${FUSION_MAX_SYNC_LAG_MS:-1000}
      LOG_EVERY: ${FUSION_LOG_EVERY:-200}
    restart: on-failure
    profiles:
      - live
      - replay-raw

  visualizer:
    build: .
    command: python3 src/visualizer.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: model_predictions
      CONSUMER_GROUP_ID: ${VISUALIZER_CONSUMER_GROUP_ID:-visualizer_group_docker}
      VISUALIZER_GUI: ${VISUALIZER_GUI:-false}
      VISUALIZER_LOG_EVERY: ${VISUALIZER_LOG_EVERY:-50}
    restart: on-failure
    profiles:
      - live
      - replay-raw

  raw_sink:
    build: .
    command: ./raw_sink
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      RAW_GCS_BUCKET: ${RAW_GCS_BUCKET:-raw-capstone-bucket}
      RAW_GCS_PREFIX: ${RAW_GCS_PREFIX:-ultrasound/raw}
      RAW_GCS_KEEP_LOCAL: ${RAW_GCS_KEEP_LOCAL:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - testing
      - data-gathering

  replay_raw_service:
    build: .
    command: ./replay_raw
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      REPLAY_GCS_BUCKET: ${RAW_GCS_BUCKET:-raw-capstone-bucket}
      REPLAY_GCS_PREFIX: ${REPLAY_RAW_GCS_PREFIX:-ultrasound/raw}
      REPLAY_FILE_PATTERN: ${REPLAY_RAW_FILE_PATTERN:-}
      REPLAY_LOOP: ${REPLAY_RAW_LOOP:-false}
      REPLAY_FRAME_INTERVAL_MS: ${REPLAY_RAW_FRAME_INTERVAL_MS:-20}
      REPLAY_TOPIC_OUT: ultrasound_raw_data_replay
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - replay-raw
