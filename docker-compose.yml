services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  preprocess-live:
    build: .
    command: ./preprocess
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data
    restart: on-failure
    profiles:
      - live

  preprocess-replay:
    build: .
    command: ./preprocess
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_raw_data_replay
    restart: on-failure
    profiles:
      - replay-raw

  output-live:
    build: .
    command: ./output
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_clean
    restart: on-failure
    profiles:
      - live
      - replay-raw

  output-replay-preprocess:
    build: .
    command: ./output
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_IN: ultrasound_clean_replay
    restart: on-failure
    profiles:
      - replay-preprocess

  prediction_consumer:
    build: .
    command: ./prediction_consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure
    profiles:
      - live
      - replay-raw
      - replay-preprocess

  raw_sink:
    build: .
    command: ./raw_sink
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      RAW_GCS_BUCKET: ${RAW_GCS_BUCKET:-raw-capstone-bucket}
      RAW_GCS_PREFIX: ${RAW_GCS_PREFIX:-ultrasound/raw}
      RAW_GCS_KEEP_LOCAL: ${RAW_GCS_KEEP_LOCAL:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - testing

  processed_sink:
    build: .
    command: ./processed_sink
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      PROCESSED_GCS_BUCKET: ${PROCESSED_GCS_BUCKET:-processed-bucket-capstone}
      PROCESSED_GCS_PREFIX: ${PROCESSED_GCS_PREFIX:-ultrasound/processed}
      PROCESSED_GCS_KEEP_LOCAL: ${PROCESSED_GCS_KEEP_LOCAL:-false}
      PROCESSED_SINK_IDLE_FLUSH_MS: ${PROCESSED_SINK_IDLE_FLUSH_MS:-5000}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - testing

  replay_raw_service:
    build: .
    command: ./replay_raw
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      REPLAY_GCS_BUCKET: ${RAW_GCS_BUCKET:-raw-capstone-bucket}
      REPLAY_GCS_PREFIX: ${REPLAY_RAW_GCS_PREFIX:-ultrasound/raw}
      REPLAY_FILE_PATTERN: ${REPLAY_RAW_FILE_PATTERN:-}
      REPLAY_LOOP: ${REPLAY_RAW_LOOP:-false}
      REPLAY_FRAME_INTERVAL_MS: ${REPLAY_RAW_FRAME_INTERVAL_MS:-20}
      REPLAY_TOPIC_OUT: ultrasound_raw_data_replay
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - replay-raw

  replay_processed_service:
    build: .
    command: ./replay_processed
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      REPLAY_GCS_BUCKET: ${PROCESSED_GCS_BUCKET:-processed-bucket-capstone}
      REPLAY_GCS_PREFIX: ${REPLAY_PROCESSED_GCS_PREFIX:-ultrasound/processed}
      REPLAY_FILE_PATTERN: ${REPLAY_PROCESSED_FILE_PATTERN:-}
      REPLAY_LOOP: ${REPLAY_PROCESSED_LOOP:-false}
      REPLAY_FRAME_INTERVAL_MS: ${REPLAY_PROCESSED_FRAME_INTERVAL_MS:-20}
      REPLAY_TOPIC_OUT: ultrasound_clean_replay
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    restart: on-failure
    profiles:
      - replay-preprocess
